name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_destroy:
        description: "Allow Terraform to delete or replace resources"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.4
  TF_STACKS: counter edge

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            site:
              - 'site/**'
            infra:
              - 'infra/**'
              - 'backend/**'
              - 'scripts/**'
              - 'tests/ci/**'
              - 'tests/js/**'
              - 'site/script.js'
              - '.github/workflows/**'

  check:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate and test each stack
        run: |
          for stack in $TF_STACKS; do
            terraform -chdir="infra/$stack" init -backend=false -input=false
            terraform -chdir="infra/$stack" validate -no-color
            terraform -chdir="infra/$stack" test -no-color
          done
      - run: shellcheck scripts/*.sh infra/bootstrap/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend tests/ci -v
      - run: node --test tests/js/*.test.mjs

  plan:
    needs: [changes, check]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.infra == 'true' &&
      vars.TF_PLAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_dns_role_arn: ${{ secrets.DNS_READ_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan
      - name: Mask the AWS account ID in logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Plan each stack
        run: for stack in $TF_STACKS; do scripts/tf-stack.sh plan "$stack"; done
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const sections = process.env.TF_STACKS.split(' ').map((stack) => {
              // The repo is public: redact 12-digit AWS account IDs before posting.
              const text = fs.readFileSync(`plan-${stack}.txt`, 'utf8').replace(/\b\d{12}\b/g, '************').slice(0, 30000);
              return `#### ${stack}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${text}\n\`\`\`\n</details>`;
            });
            const body = `${marker}\n### Terraform plan\n\n${sections.join('\n\n')}`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  deploy:
    needs: [changes, check]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.check.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ALLOW_DESTROY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_destroy }}
      TF_VAR_dns_role_arn: ${{ secrets.DNS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy
      - name: Mask the AWS account ID in logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform
        run: for stack in $TF_STACKS; do scripts/tf-stack.sh deploy "$stack"; done
      - name: Write site config
        run: |
          url=$(terraform -chdir=infra/counter output -raw api_url)
          test -n "$url"
          printf '{"counterApiUrl": "%s"}\n' "$url" > site/config.json
      - name: Sync site
        run: |
          # Upload everything with no-cache so browsers revalidate instead of guessing freshness,
          # then remove files that no longer exist.
          aws s3 cp site/ "s3://${{ vars.SITE_BUCKET }}" --recursive --cache-control "no-cache"
          aws s3 sync site/ "s3://${{ vars.SITE_BUCKET }}" --delete
      - name: Invalidate CloudFront
        run: |
          dist=$(terraform -chdir=infra/edge output -raw distribution_id)
          test -n "$dist"
          id=$(aws cloudfront create-invalidation --distribution-id "$dist" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$dist" --id "$id"

  smoke:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v6
        with:
          working-directory: tests/e2e
