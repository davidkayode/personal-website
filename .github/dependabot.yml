version: 2
updates:
  # Keeps the SHA-pinned actions in deploy.yml current with weekly update PRs.
  # Minor and patch bumps arrive together; each major bump gets its own PR to review.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
